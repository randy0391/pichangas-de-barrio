name: Auditar inactividad de jugadores

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria-inactividad-jugadores
  cancel-in-progress: false

jobs:
  audit:
    name: Revisar candidatos sin modificar cuentas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      DB_DATABASE: ${{ secrets.SUPABASE_DB_DATABASE }}
      DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DB_SSLMODE: require
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, gd, intl, pdo_pgsql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Auditar sin modificar jugadores
        run: php artisan users:deactivate-inactive --dry-run
