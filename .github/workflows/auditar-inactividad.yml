name: Auditar inactividad de jugadores

on:
  workflow_dispatch:
    inputs:
      ejecutar_desactivacion:
        description: "Actívalo solo cuando hayas revisado y autorizado la desactivación real"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auditoria-inactividad-jugadores
  cancel-in-progress: false

jobs:
  audit:
    name: Revisar candidatos de inactividad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      DB_DATABASE: ${{ secrets.SUPABASE_DB_DATABASE }}
      DB_USERNAME: ${{ secrets.SUPABASE_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DB_SSLMODE: require
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, gd, intl, pdo_pgsql, zip
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Auditar o desactivar jugadores
        env:
          EJECUTAR_DESACTIVACION: ${{ inputs.ejecutar_desactivacion }}
        run: |
          if [ "$EJECUTAR_DESACTIVACION" = "true" ]; then
            echo "MODO: DESACTIVACION REAL AUTORIZADA MANUALMENTE"
            php artisan users:deactivate-inactive --confirm
          else
            echo "MODO: SOLO AUDITORIA; NO SE MODIFICARAN CUENTAS"
            php artisan users:deactivate-inactive --dry-run
          fi
